<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 | Myanmar ECE Archive</title>
<style>
body{margin:0;background:#fffaf5;color:#263238;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.header{height:74px;background:#fff;border-bottom:1px solid #e8e2dc;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:800}.brand small{display:block;color:#929a9d;font-size:10px}.back{color:#bd6079;font-size:13px;font-weight:800}.wrap{max-width:900px;margin:auto;padding:45px 24px}.notice{background:#fff7df;border:1px solid #efdfac;border-radius:15px;padding:16px;font-size:13px;margin-bottom:20px}.panel{background:#fff;border:1px solid #e8e2dc;border-radius:22px;padding:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.full{grid-column:1/-1}input,textarea,select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #e8e2dc;border-radius:11px;font:inherit;background:#fff}textarea{min-height:100px}.actions{margin-top:20px}.btn{border:0;border-radius:11px;padding:12px 20px;background:#f58ba5;color:#fff;font-weight:800;cursor:pointer}.status{margin-top:14px;font-size:12px;color:#68777d}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header class="header"><div class="brand">Myanmar ECE Archive<small>관리자 자료 등록</small></div><a class="back" href="resources.html">← 자료실</a></header>
<main class="wrap"><div class="notice">관리자용 자료 등록 화면입니다. Supabase 연결 후 실제 업로드 기능을 활성화할 수 있습니다.</div>
<section class="panel"><h1>새 자료 등록</h1>
<form id="form" class="grid">
<div><label>자료 제목 *</label><input name="title" required></div><div><label>미얀마어 제목</label><input name="title_myanmar"></div>
<div class="full"><label>설명</label><textarea name="description"></textarea></div>
<div><label>대상</label><select name="audience"><option>교사</option><option>학생</option><option>공통</option></select></div>
<div><label>연령</label><select name="age"><option value="">전체</option><option>3세</option><option>4세</option><option>5세</option><option>6세</option></select></div>
<div><label>분야</label><select name="domain"><option>교사 자료</option><option>유아교육과 학생</option><option>성경적 유아교육</option><option>수업·활동</option><option>연구자료</option><option>자료실</option></select></div>
<div><label>언어</label><select name="language"><option>미얀마어</option><option>영어</option><option>한국어</option></select></div>
<div><label>자료 유형</label><input name="resource_type" placeholder="PDF, PPT, 워크시트 등"></div><div><label>저자/기관</label><input name="author"></div>
<div class="full"><label>파일</label><input type="file" name="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.jpg,.jpeg,.png,.mp3,.mp4"></div>
<div class="full actions"><button class="btn" type="submit">자료 등록</button></div>
</form><div id="status" class="status"></div></section></main>
<script>
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();document.querySelector("#status").textContent="Supabase 연결 후 실제 파일 업로드가 활성화됩니다.";});
</script></body></html>
