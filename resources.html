<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자료실 | Myanmar ECE Archive</title>
<style>
:root{--ink:#263238;--muted:#6b777b;--pink:#f58ba5;--cream:#fffaf5;--line:#e8e2dc;--white:#fff;--mint:#e9f6f0;--blue:#eaf5fb;--yellow:#fff5d9;--lav:#f1ecfa}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}
.header{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:800;display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:#f7b7c6;display:grid;place-items:center}.brand small{display:block;color:#929a9d;font-size:10px}.back{font-size:13px;color:#bd6079;font-weight:800}
.wrap{max-width:1180px;margin:auto;padding:45px 24px}.intro{margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:.08em;color:#bd6079;font-weight:800}.intro h1{font-size:42px;letter-spacing:-.04em;margin:6px 0}.intro p{color:var(--muted);margin:0}
.tools{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 25px rgba(50,45,40,.05);margin-bottom:28px}.search{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}.search input{flex:1;border:0;outline:0;padding:14px 16px}.search button{border:0;background:var(--pink);color:white;padding:0 22px;font-weight:800}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.filters select{width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;border-radius:12px;color:#4f5b5f}
.head{display:flex;justify-content:space-between;align-items:end;margin:25px 0 15px}.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{display:block;color:inherit;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(50,45,40,.08)}.thumb{height:130px;display:grid;place-items:center;font-size:40px}.pink{background:#fff0f4}.mint{background:var(--mint)}.blue{background:var(--blue)}.yellow{background:var(--yellow)}.lav{background:var(--lav)}
.body{padding:18px}.tag{display:inline-block;background:#f7f3ef;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800;margin-bottom:9px}.card h2{font-size:16px;line-height:1.45;margin:0 0 7px}.card p{font-size:12px;color:var(--muted);min-height:38px;margin:0 0 14px}.meta{display:flex;justify-content:space-between;color:#8a9395;font-size:11px}.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:18px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:30px 15px}.intro h1{font-size:34px}.grid,.filters{grid-template-columns:1fr}.search button{padding:0 15px}.header{padding:0 15px}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html"><span class="logo">🌱</span><span>Myanmar ECE Archive<small>미얀마 유아교육 자료 아카이브</small></span></a><a class="back" href="index.html">← 홈으로</a></header>
<main class="wrap">
<section class="intro"><div class="eyebrow">RESOURCE LIBRARY</div><h1>자료실</h1><p>교사와 유아교육과 학생을 위한 자료를 검색하고 분야별로 찾아볼 수 있습니다.</p></section>
<section class="tools">
<div class="search"><input id="q" placeholder="자료 제목이나 키워드를 검색해 보세요" oninput="render()"><button onclick="render()">검색</button></div>
<div class="filters">
<select id="audience" onchange="render()"><option value="">대상 전체</option><option>교사</option><option>학생</option><option>공통</option></select>
<select id="age" onchange="render()"><option value="">연령 전체</option><option>3세</option><option>4세</option><option>5세</option><option>6세</option></select>
<select id="domain" onchange="render()"><option value="">분야 전체</option><option>교사 자료</option><option>유아교육과 학생</option><option>성경적 유아교육</option><option>수업·활동</option><option>연구자료</option><option>자료실</option></select>
<select id="lang" onchange="render()"><option value="">언어 전체</option><option>미얀마어</option><option>영어</option><option>한국어</option></select>
</div></section>
<div class="head"><h2>전체 자료</h2><span class="count" id="count"></span></div>
<section class="grid" id="grid"></section>
</main>
<script>
const data=[];
function render(){const q=document.querySelector("#q").value.toLowerCase().trim(),a=document.querySelector("#audience").value,age=document.querySelector("#age").value,d=document.querySelector("#domain").value,l=document.querySelector("#lang").value;const out=data.filter(x=>(!q||x.join(" ").toLowerCase().includes(q))&&(!a||x.audience===a)&&(!age||x.age===age)&&(!d||x.domain===d)&&(!l||x.language===l));document.querySelector("#count").textContent=out.length+"개 자료";document.querySelector("#grid").innerHTML=out.length?out.map(x=>'<a class="card" href="resource-detail.html?id='+encodeURIComponent(x.id)+'"><div class="thumb pink">📄</div><div class="body"><span class="tag">'+x.domain+'</span><h2>'+x.title+'</h2><p>'+x.description+'</p><div class="meta"><span>'+x.resource_type+' · '+x.language+'</span><span>'+x.audience+' · '+x.age+'</span></div></div></a>').join(""):'<div class="empty">조건에 맞는 자료가 없습니다.</div>';}
const preset=new URLSearchParams(location.search).get("domain");if(preset)document.querySelector("#domain").value=preset;
</script>
<script>window.ECE_SHEET_ID="";window.ECE_SHEET_NAME="Resources";</script><script src="resources.js"></script>
</body></html>
